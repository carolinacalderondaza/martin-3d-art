<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIM - We print beautiful 3D art</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Lato', sans-serif; }
        body { background-color: #f4f6f9; color: #333; line-height: 1.6; }
        header { background: #111; color: #fff; padding: 2.5rem 1rem; text-align: center; }
        header h1 { font-size: 2.5rem; margin-bottom: 0.3rem; color: #f39c12; letter-spacing: 2px; }
        header p { font-size: 1.1rem; color: #aaa; }
        
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        
        .palette-section { background: #fff; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .palette-section h3 { color: #2c3e50; margin-bottom: 0.5rem; }
        .palette-section img { max-width: 100%; height: auto; border-radius: 6px; margin-top: 1rem; }

        h2.section-title { font-size: 1.8rem; margin: 2rem 0 1rem; border-bottom: 2px solid #ddd; padding-bottom: 0.5rem; color: #2c3e50; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        
        .card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 230px; object-fit: cover; background: #eee; }
        
        .card-content { padding: 1.2rem; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; color: #2c3e50; }
        .card-details { font-size: 0.9rem; color: #666; margin-bottom: 1rem; flex-grow: 1; }
        .card-price { font-size: 1.3rem; font-weight: 900; color: #e67e22; margin-bottom: 1rem; }
        
        .btn-wa { background: #27ae60; color: white; border: none; padding: 0.75rem; border-radius: 5px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; display: block; transition: background 0.2s; }
        .btn-wa:hover { background: #219653; }
        
        #status-msg { text-align: center; padding: 2rem; font-size: 1.2rem; color: #666; }
        
        footer { background: #222; color: #aaa; text-align: center; padding: 2rem; margin-top: 3rem; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <h1>NIM</h1>
        <p>We print beautiful 3D art — AMORES PARA TODOS</p>
    </header>

    <div class="container">

        <!-- PALETA DE COLORES -->
        <div class="palette-section">
            <h3>Paleta de colores disponibles</h3>
            <p>Elegí el color y material ideal para tu impresión 3D.</p>
            <img src="NIM_archivos/67b6314e94e7c174a98dfa31_colores.jpeg" alt="Paleta de Colores">
        </div>

        <div id="status-msg">Cargando catálogo...</div>

        <div id="catalogo-container" style="display: none;">
            <h2 class="section-title">Catálogo de Productos</h2>
            <div class="grid" id="product-grid"></div>

            <h2 class="section-title" style="margin-top: 3rem;">Accesorios y Adicionales</h2>
            <div class="grid" id="accessories-grid"></div>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 NIM 3D Art.</p>
    </footer>

    <script>
        // URL pública de exportación CSV de tu planilla publicada
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSTvL1QDJehc_On3y8fXAX3e2lCusKoS5yTz5CxCWRkg7-Vv4hI46s2r8Du3d-QlqPQ_ZmL-pEW80RA/pub?output=csv';

        // Función para parsear CSV respetando comillas y comas
        function parseCSV(text) {
            const lines = text.split('\n');
            const result = [];
            
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                // Expresión regular para separar por coma respetando comillas
                const row = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || line.split(',');
                const cleanRow = row.map(val => val.replace(/^"|"$/g, '').trim());
                result.push(cleanRow);
            }
            return result;
        }

        async function cargarCatalogo() {
            const statusMsg = document.getElementById('status-msg');
            const catalogoContainer = document.getElementById('catalogo-container');
            const productGrid = document.getElementById('product-grid');
            const accessoriesGrid = document.getElementById('accessories-grid');

            try {
                // Fetch directo al CSV publicado de Google Sheets
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('No se pudo acceder a la planilla');
                
                const csvData = await response.text();
                
                // Separar filas
                const rows = csvData.split('\n').map(r => r.trim()).filter(r => r.length > 0);
                
                if (rows.length <= 1) {
                    statusMsg.innerHTML = 'La planilla parece estar vacía.';
                    return;
                }

                statusMsg.style.display = 'none';
                catalogoContainer.style.display = 'block';
                productGrid.innerHTML = '';
                accessoriesGrid.innerHTML = '';

                let esSeccionAccesorio = false;

                // Empezar desde la fila 1 (salteando la cabecera)
                for (let i = 1; i < rows.length; i++) {
                    const columns = rows[i].split('\t').length > 1 ? rows[i].split('\t') : rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    
                    const cleanCols = columns.map(c => c.replace(/^"|"$/g, '').trim());
                    
                    const nombre = cleanCols[0] || '';
                    const precioStr = cleanCols[1] || '';
                    const detalles = cleanCols[2] || '';
                    const imagen = cleanCols[3] || 'NIM_archivos/placeholder.jpg';
                    const activo = (cleanCols[4] || 'SI').toUpperCase();

                    // Detectar separador de sección
                    if (nombre.includes('ACCESORIOS') || nombre.includes('---')) {
                        esSeccionAccesorio = true;
                        continue;
                    }

                    if (nombre && (activo === 'SI' || activo === 'TRUE' || activo === 'VERDADERO')) {
                        const precioNum = parseInt(precioStr.replace(/[^0-9]/g, '')) || 0;
                        const precioFormateado = precioNum > 0 ? `$${precioNum.toLocaleString('es-AR')}` : '';
                        const mensajeWA = encodeURIComponent(`Hola! Quiero consultar por ${nombre} (${precioFormateado})`);

                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <img src="${imagen}" alt="${nombre}" onerror="this.src='https://via.placeholder.com/300x230?text=NIM+3D+Art'">
                            <div class="card-content">
                                <div class="card-title">${nombre}</div>
                                <div class="card-details">${detalles}</div>
                                <div class="card-price">${precioFormateado}</div>
                                <a class="btn-wa" href="https://wa.me/?text=${mensajeWA}" target="_blank">Encargar por WhatsApp</a>
                            </div>
                        `;

                        if (esSeccionAccesorio) {
                            accessoriesGrid.appendChild(card);
                        } else {
                            productGrid.appendChild(card);
                        }
                    }
                }

            } catch (error) {
                console.error(error);
                statusMsg.innerHTML = '<p style="color:red;">Error al conectar con Google Sheets. Verifica que la planilla siga publicada en la web.</p>';
            }
        }

        window.onload = cargarCatalogo;
    </script>
</body>
</html>
